name: Publish release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Match tag and project version
        run: |
          python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          tag = os.environ['GITHUB_REF_NAME']
          version = ET.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), 'Expected a vMAJOR.MINOR.PATCH tag'
          assert tag == 'v' + version, 'Tag must match the Maven project version'
          PY
      - run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Package assets and checksums
        run: |
          mkdir -p dist
          cp target/terraform-change-review.jar "dist/terraform-change-review-${GITHUB_REF_NAME#v}.jar"
          cd dist
          sha256sum "terraform-change-review-${GITHUB_REF_NAME#v}.jar" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/terraform-change-review-${GITHUB_REF_NAME#v}.jar" dist/SHA256SUMS \
            --verify-tag --title "Terraform Change Review $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
