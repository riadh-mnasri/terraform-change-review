name: Kotlin and Gradle verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Gradle wrapper JAR
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
      - run: ./gradlew --no-daemon clean build
      - name: Packaged CLI smoke test
        run: java -jar build/libs/terraform-change-review.jar review examples/gcp-risky.json --format markdown --fail-on none
